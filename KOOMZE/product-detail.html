<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品详情 - KOOMZE</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="common.css">
  <style>
    /* ========== Detail Page — Layout ========== */
    .container { max-width:1100px; margin:0 auto; padding:30px 24px 60px; padding-top: calc(30px + var(--topbar-h, 56px)); position:relative; z-index:2; }
    .detail-layout { display:flex; gap:40px; align-items:flex-start; }
    .detail-left { flex:0 0 52%; position:sticky; top:calc(var(--topbar-h, 56px) + 20px); text-align:center; }
    .detail-right { flex:1; min-width:0; text-align:left; }

    /* ========== Detail Page — Main Image ========== */
    .main-image { width:100%; margin-bottom:20px; border-radius:0; overflow:hidden; box-shadow:0 12px 40px var(--shadow); }
    .main-image img { width:100%; border-radius:0; object-fit:contain; display:block; background:#f5f5f7; transition: opacity 0.3s ease; }

    /* ========== Detail Page — Color Selector ========== */
    .color-selector { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; margin-bottom:8px; }
    .color-dot {
        width:44px; height:44px; border-radius:50%; cursor:pointer;
        border:3px solid var(--border); background:#f5f5f7;
        background-size:cover; background-position:center;
        transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        position:relative; flex-shrink:0;
    }
    .color-dot:hover { transform:scale(1.12); border-color:var(--theme); box-shadow:0 4px 16px var(--theme-glow); }
    .color-dot.active { border-color:var(--theme); box-shadow:0 0 0 4px var(--theme-glow); transform:scale(1.08); }
    .color-dot::after {
        content:attr(data-label); position:absolute; bottom:-24px; left:50%;
        transform:translateX(-50%); font-size:12px; color:var(--text2);
        white-space:nowrap; font-weight:500; opacity:0;
        transition: opacity 0.2s ease;
    }
    .color-dot:hover::after, .color-dot.active::after { opacity:1; }
    .color-selector-label { width:100%; text-align:center; font-size:13px; color:var(--text3); margin-bottom:4px; }

    /* ========== Detail Page — Product Name ========== */
    h1 { font-size:2rem; margin-bottom:24px; font-weight:800; text-align:left; animation:fadeInUp 0.5s ease both; }

    /* ========== Detail Page — Introduction ========== */
    .product-introduction {
        background:var(--card); border:1px solid var(--border); border-radius:0;
        padding:20px 24px; margin-bottom:24px; line-height:1.8;
        color:var(--text); font-size:0.95rem;
    }
    .product-introduction:empty { display:none; }
    .product-introduction h2, .product-introduction h3 { margin:16px 0 8px; font-weight:700; }
    .product-introduction h2 { font-size:1.2rem; color:var(--theme); }
    .product-introduction h3 { font-size:1.05rem; }
    .product-introduction ul, .product-introduction ol { padding-left:20px; margin:8px 0; }
    .product-introduction li { margin:4px 0; }
    .product-introduction strong { color:var(--text); }
    .product-introduction p { margin:8px 0; }
    .intro-title { font-size:1.1rem; font-weight:700; color:var(--theme); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .section-icon { width:22px; height:22px; object-fit:contain; vertical-align:middle; }
    .back-link { display:inline-block; margin-top:20px; color:var(--theme); text-decoration:none; font-weight:600; transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1); }
    .back-link:hover { transform:translateX(-4px); }

    /* ========== Detail Page — Buy Button & Hover Popup ========== */
    .buy-section { position:relative; display:inline-block; margin-top:20px; }
    .buy-trigger {
      display:inline-flex; align-items:center; gap:8px;
      background:var(--theme); color:#fff; padding:16px 44px; border-radius:8px;
      font-weight:700; font-size:1.05rem; cursor:pointer; border:none;
      box-shadow:0 6px 24px var(--theme-glow);
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      position:relative;
    }
    .buy-icon-inline { width:22px; height:22px; object-fit:contain; vertical-align:middle; filter:brightness(0)invert(1); }
    .buy-trigger:hover { background:var(--theme2); box-shadow:0 8px 32px var(--theme-glow); transform:translateY(-2px); }
    .buy-popup {
      position:absolute; top:calc(100% + 16px); left:50%; transform:translateX(-50%);
      background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:12px 8px; display:flex; gap:10px;
      box-shadow:0 16px 48px rgba(0,0,0,0.25);
      opacity:0; visibility:hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      transform:translateX(-50%) translateY(-8px);
      white-space:nowrap; z-index:9999;
    }
    .buy-trigger:hover .buy-popup,
    .buy-popup:hover,
    .buy-popup.open { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
    .buy-trigger:focus-visible { outline:2px solid var(--theme2); outline-offset:2px; }
    .buy-popup::after {
      content:''; position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
      border:8px solid transparent; border-bottom-color:var(--card);
    }
    .buy-platform {
      display:flex; flex-direction:column; align-items:center; gap:6px;
      padding:14px 20px; border-radius:10px; text-decoration:none;
      font-weight:600; font-size:0.85rem; color:var(--text);
      transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      min-width:80px; background:var(--bg); border:1px solid transparent;
    }
    .buy-platform:hover { transform:translateY(-4px); }
    .buy-platform.taobao:hover { background:#ff5000; color:#fff; border-color:#ff5000; box-shadow:0 8px 24px rgba(255,80,0,0.35); }
    .buy-platform.jd:hover { background:#e2231a; color:#fff; border-color:#e2231a; box-shadow:0 8px 24px rgba(226,35,26,0.35); }
    .buy-platform.douyin:hover { background:#fe2c55; color:#fff; border-color:#fe2c55; box-shadow:0 8px 24px rgba(254,44,85,0.35); }
    .buy-platform-icon { width:28px; height:28px; object-fit:contain; display:block; }
    /* hover 时图标反白 */
    .buy-platform.taobao:hover .buy-platform-icon { filter:brightness(0)invert(1); }
    .buy-platform.jd:hover .buy-platform-icon { filter:brightness(0)invert(1); }
    .buy-platform.douyin:hover .buy-platform-icon { filter:brightness(0)invert(1); }

    /* ========== Detail Page — Entry Animations ========== */
    .detail-left { animation:fadeInUp 0.5s ease both; animation-delay:0.1s; }
    .detail-right { animation:fadeInUp 0.5s ease both; animation-delay:0.2s; }
    .back-link { animation:fadeIn 0.5s ease both; animation-delay:0.4s; }

    /* ========== Detail Page — Responsive ========== */
    @media (max-width:768px) {
        .detail-layout { flex-direction:column; gap:24px; }
        .detail-left { position:static; flex:auto; }
        .detail-right { text-align:center; }
        h1 { text-align:center; }
        .color-dot { width:36px; height:36px; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 产品名称：整行标题，位于产品图与介绍框上方 -->
  <h1 id="detail-name"></h1>
  <div class="detail-layout">
    <!-- 左侧：产品主图 + 颜色选择器 + 立即购买 -->
    <div class="detail-left">
      <div class="main-image"><img id="mainImage" src="" alt="产品主图" onerror="this.onerror=null;this.src='Pictures/components/KOOMZE.png';"></div>
      <div class="color-selector-label" id="colorLabel"></div>
      <div class="color-selector" id="colorSelector"></div>
      <div class="buy-section">
        <div class="buy-trigger" role="button" tabindex="0" aria-haspopup="true">
          <span class="lang-zh"><img class="buy-icon-inline" src="Pictures/components/立即购买.svg" alt=""> 立即购买</span><span class="lang-tw"><img class="buy-icon-inline" src="Pictures/components/立即购买.svg" alt=""> 立即購買</span><span class="lang-en"><img class="buy-icon-inline" src="Pictures/components/立即购买.svg" alt=""> Buy Now</span>
          <div class="buy-popup">
            <a href="#" class="buy-platform taobao" target="_blank" rel="noopener" id="linkTaobao"><img class="buy-platform-icon" src="Pictures/components/淘宝.svg" alt="">淘宝</a>
            <a href="#" class="buy-platform jd" target="_blank" rel="noopener" id="linkJd"><img class="buy-platform-icon" src="Pictures/components/京东.svg" alt="">京东</a>
            <a href="#" class="buy-platform douyin" target="_blank" rel="noopener" id="linkDouyin"><img class="buy-platform-icon" src="Pictures/components/抖音.svg" alt="">抖音</a>

        <div id="introContent"></div>
      </div>
      <br>
      <a href="Product.html" class="back-link">← <span class="lang-zh">返回产品列表</span><span class="lang-tw">返回產品列表</span><span class="lang-en">Back to Products</span></a>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  let product = null;
  let detailLoadFailed = false;
  let productNameMap = {};
  let currentColorIndex = 0;
  const urlParams = new URLSearchParams(window.location.search);
  const rawId = urlParams.get('id');

  function resolveName(pid, fallback) {
    return productNameMap[pid] || fallback || pid || '未知产品';
  }

  // 按 productId 筛选详情；区分不存在与请求失败。
  async function fetchDetailFromAPI(pid) {
    try {
      const res = await fetch('/api/content/product-detail?productId=' + encodeURIComponent(pid));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('产品详情格式错误');
      detailLoadFailed = false;
      if (data.length === 0) return null;
      const item = data[0];
      return {
        id: item.productId, pid: item.productId,
        img: item.image,
        colors: (item.colors && item.colors.length > 0) ? item.colors : null,
        introduction: item.introduction || '',
        links: {
          taobao: item.buyLink1 || '#',
          jd: item.buyLink2 || '#',
          douyin: item.buyLink3 || '#'
        }
      };
    } catch (e) { detailLoadFailed = true; return null; }
  }

  function loadProduct() {
    if (!product) {
      document.querySelector('.container').innerHTML =
        '<p role="status" style="text-align:center;padding:60px;">' + (detailLoadFailed ? contentStateHTML(true) : '<span class="lang-zh">产品不存在</span><span class="lang-tw">產品不存在</span><span class="lang-en">Product not found</span>') + '</p>' +
        '<p style="text-align:center;"><a href="Main.html"><span class="lang-zh">返回首页</span><span class="lang-tw">返回首頁</span><span class="lang-en">Back to Home</span></a></p>';
      return false;
    }
    return true;
  }

  function getProductName(p) { return p['name_'+(currentLang==='zh-CN'?'zh':currentLang==='zh-TW'?'tw':'en')]; }

  function getCurrentImage() {
    if (product.colors && product.colors.length > 0 && currentColorIndex < product.colors.length) {
      return product.colors[currentColorIndex].image;
    }
    return product.img;
  }

  function renderColorSelector() {
    const selectorEl = document.getElementById('colorSelector');
    const labelEl = document.getElementById('colorLabel');
    if (!selectorEl) return;
    const colors = product.colors;
    if (!colors || colors.length <= 1) {
      selectorEl.innerHTML = '';
      labelEl.textContent = '';
      return;
    }
    labelEl.innerHTML = '<span class="lang-zh">选择颜色</span><span class="lang-tw">選擇顏色</span><span class="lang-en">Select Color</span>';
    selectorEl.innerHTML = colors.map((c, i) =>
      '<div class="color-dot' + (i === currentColorIndex ? ' active' : '') + '" data-index="' + i + '" data-label="' + escapeHTML(c.name) + '" style="background-image:url(\'' + escapeHTML(c.image || product.img) + '\');" title="' + escapeHTML(c.name) + '"></div>'
    ).join('');
    selectorEl.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', function() {
        const idx = parseInt(this.dataset.index);
        if (idx === currentColorIndex) return;
        currentColorIndex = idx;
        document.getElementById('mainImage').src = getCurrentImage();
        selectorEl.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        this.classList.add('active');
      });
    });
  }

  // 前台与后台共用相同的编辑器格式白名单。
  function sanitizeHTML(html) {
    return sanitizeRichText(html);
  }

  function updateContent() {
    const name = getProductName(product);
    document.title = name + ' - KOOMZE';
    document.getElementById('detail-name').innerText = name;
    document.getElementById('mainImage').src = getCurrentImage();
    document.getElementById('mainImage').alt = name;

    const introEl = document.getElementById('productIntro');
    const introContentEl = document.getElementById('introContent');
    if (introEl && introContentEl) {
      if (product.introduction && product.introduction.trim()) {
        introContentEl.innerHTML = sanitizeHTML(product.introduction);
        introEl.style.display = 'block';
      } else {
        introEl.style.display = 'none';
      }
    }

    renderColorSelector();

    const links = product.links || {};
    const platforms = [
      { id: 'linkTaobao', href: links.taobao },
      { id: 'linkJd',     href: links.jd },
      { id: 'linkDouyin', href: links.douyin }
    ];
    let hasLink = false;
    platforms.forEach(p => {
      const el = document.getElementById(p.id);
      if (el) {
        const href = p.href !== '#' ? safeWebURL(p.href) : '';
        if (href) { el.href = href; el.style.display = 'flex'; hasLink = true; }
        else { el.style.display = 'none'; }
      }
    });
    const buySection = document.querySelector('.buy-section');
    if (buySection) buySection.style.display = hasLink ? 'inline-block' : 'none';
  }

  function initBuyPopup() {
    const trigger = document.querySelector('.buy-trigger');
    const popup = document.querySelector('.buy-popup');
    if (!trigger || !popup) return;
    trigger.addEventListener('click', function (e) {
      // 触屏设备没有 hover，点击展开购买平台
      if (window.matchMedia('(hover: none)').matches) {
        e.stopPropagation();
        popup.classList.toggle('open');
      }
    });
    trigger.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); popup.classList.toggle('open'); }
    });
    document.addEventListener('click', function () { popup.classList.remove('open'); });
  }

  function hideLoader() {
    const loader = document.getElementById('pageLoader');
    if (loader) { loader.classList.add('hidden'); }
  }

  async function init() {
    initCommon(function() { if (product) updateContent(); });
    if (!rawId) {
      document.querySelector('.container').innerHTML =
        '<p style="text-align:center;padding:60px;"><span class="lang-zh">缺少产品 ID 参数</span><span class="lang-tw">缺少產品 ID 參數</span><span class="lang-en">Missing product ID</span></p>' +
        '<p style="text-align:center;"><a href="Product.html"><span class="lang-zh">返回产品列表</span><span class="lang-tw">返回產品列表</span><span class="lang-en">Back to Products</span></a></p>';
      hideLoader();
      return;
    }

    // ⚡ 并行获取：产品列表（用于名称映射+导航）+ 产品详情（按 productId 筛选）
    const [products, detailData] = await Promise.all([
      fetchProducts(),
      fetchDetailFromAPI(rawId)
    ]);

    // 构建名称映射
    if (products && products.length > 0) {
      products.forEach(p => { productNameMap[p.productId] = p.name; });
    }

    // 确定产品数据
    if (detailData) {
      // ⚡ 名称映射已在上面构建完毕，此处再解析一次得到友好名称
      const name = resolveName(detailData.pid, detailData.pid);
      detailData.name_zh = detailData.name_tw = detailData.name_en = name;
      product = detailData;
    } else {
      product = null;
    }

    if (!loadProduct()) { initDynamicNav(products); initFooterSocial(); hideLoader(); return; }

    updateContent();
    initBuyPopup();

    // ⚡ 传入已获取的产品数据，避免导航重复请求
    initDynamicNav(products);
    initFooterSocial();

    // 内容加载完毕，隐藏动画
    hideLoader();
  }

  init();
</script>
